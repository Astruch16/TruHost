<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500&display=swap">
<style>
body{margin:0}
a{color:#173F3A}a:hover{color:#0E2A26}
@keyframes lg-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes lg-sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@keyframes lg-shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%{transform:translate(-460px,240px);opacity:0}100%{transform:translate(-460px,240px);opacity:0}}
@keyframes lg-fly{0%{transform:translate(-160px,0)}50%{transform:translate(760px,-30px)}100%{transform:translate(1700px,10px)}}
@keyframes lg-flap{0%,40%,100%{transform:scaleY(1)}10%,30%{transform:scaleY(-0.55)}20%{transform:scaleY(1)}}
@keyframes lg-wave{from{transform:translateX(0)}to{transform:translateX(var(--wl))}}
@keyframes lg-drift{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
@keyframes lg-smoke{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:.4}100%{transform:translate(26px,-90px) scale(2);opacity:0}}
@keyframes lg-firefly{0%,100%{opacity:0;transform:translate(0,0)}35%{opacity:1}65%{opacity:.7;transform:translate(12px,-16px)}}
@keyframes lg-glow{0%,100%{opacity:.82}50%{opacity:1}}
@keyframes lg-shimmer{0%,100%{opacity:.25;transform:scaleX(.7)}50%{opacity:.75;transform:scaleX(1.1)}}
@keyframes lg-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lg-twinkle{animation:lg-twinkle 3s ease-in-out infinite}
.lg-sway{animation:lg-sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.lg-shoot{animation:lg-shoot 9s linear infinite}
.lg-fly{animation:lg-fly 34s linear infinite}
.lg-flap{animation:lg-flap 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.lg-wave{animation:lg-wave 8s linear infinite}
.lg-drift{animation:lg-drift 22s ease-in-out infinite}
.lg-smoke{animation:lg-smoke 6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.lg-firefly{animation:lg-firefly 4s ease-in-out infinite}
.lg-glow{animation:lg-glow 4s ease-in-out infinite}
.lg-shimmer{animation:lg-shimmer 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.lg-rise{animation:lg-rise .7s cubic-bezier(.2,.7,.2,1) both}
.lg-input:focus{outline:none;border-color:#173F3A;box-shadow:0 0 0 3px rgba(23,63,58,.18)}
.lg-btn:hover{filter:brightness(1.12)}
.lg-btn:focus-visible,.lg-ghost:focus-visible{outline:3px solid rgba(23,63,58,.35);outline-offset:2px}
.lg-ghost:hover{background:#F6F6F3}
@media (prefers-reduced-motion:reduce){.lg-twinkle,.lg-sway,.lg-shoot,.lg-fly,.lg-flap,.lg-drift,.lg-smoke,.lg-firefly,.lg-glow,.lg-shimmer,.lg-wave,.lg-rise{animation:none}.lg-shoot,.lg-fly{display:none}}
</style>
</helmet>

<input class="lg-input" id="lg-pw" type="{{pwType}}" autocomplete="current-password" placeholder="Your password" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 48px 0 14px; font: inherit; font-size: 15px; color: #1A1D21; background: #FFFFFF; border: 1px solid #DADDD7; border-radius: 12px">
<button onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px; cursor: pointer; color: #5B6068; display: flex; align-items: center; justify-content: center">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>

<button class="lg-btn" style="height: 50px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; background: linear-gradient(180deg, #24574F, #173F3A); border: 0; border-radius: 12px; box-shadow: 0 8px 18px rgba(23, 63, 58, 0.3), 0 1px 0 rgba(255, 255, 255, 0.2) inset; cursor: pointer">Sign in</button>

<div class="lg-rise" style="animation-delay: .25s; font-family: 'Caveat', cursive; font-size: 30px; color: rgba(255, 255, 255, 0.92); transform: rotate(-3deg); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35)">Better stays. Higher returns.</div>
</div>

<div style="position: absolute; z-index: 1; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 22px; font-size: 13px">

<a href="#" style="color: rgba(255, 255, 255, 0.75); text-decoration: none">Accessibility</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { showPw: false };
}
renderVals() {
var self = this;
var seed = 11;
var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
var f1 = function (v) { return Math.round(v * 10) / 10; };
var tree = function (x, base, h, w, n) {
var trunkH = h * 0.08, cb = base - trunkH, frac = 0.34, dark = '', lit = '';
var tw = Math.max(1.5, w * 0.05);
dark += 'M' + f1(x - tw) + ' ' + f1(base + 6) + ' L' + f1(x - tw) + ' ' + f1(cb - 4) + ' L' + f1(x + tw) + ' ' + f1(cb - 4) + ' L' + f1(x + tw) + ' ' + f1(base + 6) + 'Z ';
for (var i = 0; i < n; i++) {
var bot = cb - (h - trunkH) * (1 - frac) * i / (n - 1);
var th = (h - trunkH) * frac;
var top = bot - th;
var hw = w / 2 * (1 - 0.74 * i / (n - 1));
dark += 'M' + f1(x) + ' ' + f1(top) +
' Q' + f1(x - hw * 0.3) + ' ' + f1(top + th * 0.55) + ' ' + f1(x - hw) + ' ' + f1(bot) +
' Q' + f1(x - hw * 0.45) + ' ' + f1(bot - th * 0.2) + ' ' + f1(x) + ' ' + f1(bot - th * 0.06) +
' Q' + f1(x + hw * 0.45) + ' ' + f1(bot - th * 0.2) + ' ' + f1(x + hw) + ' ' + f1(bot) +
' Q' + f1(x + hw * 0.3) + ' ' + f1(top + th * 0.55) + ' ' + f1(x) + ' ' + f1(top) + 'Z ';
lit += 'M' + f1(x) + ' ' + f1(top) +
' Q' + f1(x + hw * 0.3) + ' ' + f1(top + th * 0.55) + ' ' + f1(x + hw) + ' ' + f1(bot) +
' Q' + f1(x + hw * 0.6) + ' ' + f1(bot - th * 0.16) + ' ' + f1(x + hw * 0.18) + ' ' + f1(bot - th * 0.12) +
' Q' + f1(x + hw * 0.12) + ' ' + f1(top + th * 0.5) + ' ' + f1(x) + ' ' + f1(top) + 'Z ';
}
var dur = 6 + rnd() * 0.6;
var delay = -dur + (x / 1440) * 2.4 + rnd() * 0.3;
return { d: dark, lit: lit, delay: delay.toFixed(2) + 's', dur: dur.toFixed(2) + 's' };
};
var wave = function (y0, amp, len, from, to) {
var d = 'M' + from + ' ' + y0 + ' Q' + f1(from + len / 4) + ' ' + f1(y0 - amp) + ' ' + f1(from + len / 2) + ' ' + y0;
for (var xx = from + len; xx <= to; xx += len / 2) d += ' T' + f1(xx) + ' ' + y0;
return d;
};
var ripples = [];
for (var r = 0; r < 7; r++) {
var len = 70 + rnd() * 50;
var dir = r % 2 === 0 ? -1 : 1;
ripples.push({ d: wave(626 + r * 10.5, 1.4 + rnd() * 1.4, len, -2 * len, 1440 + 2 * len), wl: (dir * len).toFixed(1) + 'px', dur: (7 + rnd() * 6).toFixed(2) + 's', op: (0.12 + rnd() * 0.12).toFixed(2) });
}
var reflect = [];
for (var m = 0; m < 9; m++) {
var rl = 22 + rnd() * 16;
var rdir = m % 2 === 0 ? -1 : 1;
reflect.push({ d: wave(624 + m * 7.5, 1.8 + rnd() * 1.2, rl, 1060 - 2 * rl, 1400 + 2 * rl), wl: (rdir * rl).toFixed(1) + 'px', dur: (2.6 + rnd() * 2).toFixed(2) + 's', op: (0.85 - m * 0.07).toFixed(2), sw: (2.6 - m * 0.15).toFixed(2) });
}
var stars = [];
for (var s = 0; s < 110; s++) {
stars.push({ x: f1(rnd() * 1440), y: f1(rnd() * 470), r: f1(0.5 + rnd() * 1.4), delay: (-rnd() * 4).toFixed(2) + 's', dur: (2.4 + rnd() * 3).toFixed(2) + 's' });
}
var sparkle = function (x, y, r) {
return 'M' + x + ' ' + (y - r) + ' Q' + (x + r * 0.15) + ' ' + (y - r * 0.15) + ' ' + (x + r) + ' ' + y + ' Q' + (x + r * 0.15) + ' ' + (y + r * 0.15) + ' ' + x + ' ' + (y + r) + ' Q' + (x - r * 0.15) + ' ' + (y + r * 0.15) + ' ' + (x - r) + ' ' + y + ' Q' + (x - r * 0.15) + ' ' + (y - r * 0.15) + ' ' + x + ' ' + (y - r) + 'Z';
};
var sparkles = [[140, 90, 6], [430, 170, 5], [820, 70, 6], [980, 240, 4], [1360, 60, 5], [300, 300, 4]].map(function (p) {
return { d: sparkle(p[0], p[1], p[2]), delay: (-rnd() * 4).toFixed(2) + 's' };
});
var row = function (count, base, wave, hmin, hvar, skipFrom, skipTo, n) {
var out = [];
for (var k = 0; k < count; k++) {
var x = (k + 0.5) * 1440 / count + (rnd() - 0.5) * 20;
if (x > skipFrom && x < skipTo) continue;
var b = base + Math.sin(x / 180) * wave + (rnd() - 0.5) * 6;
var h = hmin + rnd() * hvar;
out.push(tree(x, b, h, h * (0.36 + rnd() * 0.14), n));
}
return out;
};
var backTrees = row(72, 606, 9, 22, 26, 9999, 9999, 4);
var midTrees = row(32, 702, 12, 58, 52, 940, 1150, 5);
var bigTrees = [
[34, 400, 7], [112, 320, 6], [184, 250, 6], [246, 190, 5], [300, 140, 5],
[1300, 280, 6], [1360, 360, 7], [1420, 420, 7]
].map(function (t) { return tree(t[0], 834, t[1], t[1] * 0.42, t[2]); });
var fireflies = [];
for (var q = 0; q < 16; q++) {
var fx = rnd() < 0.5 ? 60 + rnd() * 420 : 960 + rnd() * 420;
fireflies.push({ x: f1(fx), y: f1(650 + rnd() * 140), delay: (-rnd() * 4).toFixed(2) + 's', dur: (3 + rnd() * 3).toFixed(2) + 's' });
}
return {
stars: stars, sparkles: sparkles, ripples: ripples, reflect: reflect, backTrees: backTrees, midTrees: midTrees, bigTrees: bigTrees, fireflies: fireflies,
pwType: this.state.showPw ? 'text' : 'password',
pwLabel: this.state.showPw ? 'Hide password' : 'Show password',
togglePw: function () { self.setState({ showPw: !self.state.showPw }); }
};
}
}
</script>
